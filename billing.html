<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets | Billing</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#fff8dc 0%,#f6df9b 45%,#ead08a 100%);
    color:#35110c;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#74150d,#350503);
    padding:22px 15px;
    text-align:center;
    color:white;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.logo{
    width:88px;
    height:88px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    padding:4px;
    border:3px solid #e1b52e;
}

.header h1{
    margin-top:9px;
    color:#ffd95a;
    font-size:27px;
    letter-spacing:.5px;
}

.header p{
    margin-top:5px;
    color:#fff2b8;
    font-size:14px;
}

.container{
    width:94%;
    max-width:1150px;
    margin:22px auto 40px;
}

.status{
    padding:14px;
    margin-bottom:18px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    background:#fff9df;
    border:1px solid #dfbd55;
    color:#68140e;
}

.card{
    background:rgba(255,255,255,.97);
    border:1px solid #e1c36c;
    border-radius:17px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 7px 25px rgba(70,30,10,.14);
}

.card h2{
    color:#68140e;
    margin-bottom:17px;
    font-size:21px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.info{
    padding:15px;
    border-radius:12px;
    background:#fff9e8;
    border:1px solid #e6ca76;
}

.info span{
    display:block;
    font-size:13px;
    color:#80604b;
}

.info strong{
    display:block;
    margin-top:6px;
    color:#68140e;
    font-size:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
}

.field label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #cba94e;
    background:#fffdf7;
    color:#35110c;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#68140e;
    box-shadow:0 0 0 2px rgba(104,20,14,.08);
}

.add-btn{
    padding:13px 20px;
    background:#68140e;
    color:white;
    font-size:15px;
}

.add-btn:hover{
    background:#8a2118;
}

.quick-label{
    margin-top:16px;
    margin-bottom:8px;
    font-size:13px;
    color:#80604b;
    font-weight:bold;
}

.quick{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.quick button{
    border:1px solid #d6ad3e;
    background:#fff4cd;
    color:#68140e;
    padding:9px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.quick button:hover{
    background:#f5df9d;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
}

th{
    background:#68140e;
    color:#ffd95a;
    padding:13px 8px;
    font-size:14px;
}

td{
    padding:12px 8px;
    text-align:center;
    border-bottom:1px solid #ead9aa;
}

tr:hover td{
    background:#fffaf0;
}

.remove{
    background:#b3261e;
    color:white;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    border:none;
}

.empty{
    padding:32px;
    text-align:center;
    color:#8b7868;
}

.payment-layout{
    display:flex;
    justify-content:flex-end;
}

.summary{
    width:390px;
    max-width:100%;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #ead9aa;
}

.discount-input{
    width:135px;
    text-align:right;
}

.total{
    border-bottom:0;
    padding-top:17px;
    font-size:25px;
    font-weight:bold;
    color:#68140e;
}

.payment-methods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:18px;
}

.payment-option{
    border:2px solid #e2c56d;
    border-radius:11px;
    padding:15px;
    text-align:center;
    background:#fffaf0;
    cursor:pointer;
    transition:.2s;
}

.payment-option:hover{
    transform:translateY(-2px);
}

.payment-option input{
    width:auto;
    margin-right:5px;
}

.save{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#68140e,#ad7600);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.save:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:9px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e5f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe2df;
    color:#8b1a13;
}

@media(max-width:750px){

    .header h1{
        font-size:22px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .payment-methods{
        grid-template-columns:1fr;
    }

    .card{
        padding:15px;
    }

}

</style>

</head>

<body>


<header class="header">

    <img
        src="logo.jpg"
        class="logo"
        alt="Raghavendra Sweets Logo"
    >

    <h1>RAGHAVENDRA SWEETS</h1>

    <p>Smart Billing System</p>

</header>


<main class="container">


<div id="status" class="status">
    🔄 Connecting to database...
</div>


<!-- BILL INFO -->

<section class="card">

    <div class="info-grid">

        <div class="info">
            <span>Bill Number</span>
            <strong id="billNumber">---</strong>
        </div>

        <div class="info">
            <span>Date</span>
            <strong id="billDate">---</strong>
        </div>

        <div class="info">
            <span>Time</span>
            <strong id="billTime">---</strong>
        </div>

    </div>

</section>


<!-- ADD SWEET -->

<section class="card">

    <h2>🍬 Add Sweet</h2>

    <div class="form-grid">


        <div class="field">

            <label>Select Sweet</label>

            <select id="productSelect">

                <option value="">
                    Loading sweets...
                </option>

            </select>

        </div>


        <div class="field">

            <label>Quantity (KG)</label>

            <input
                id="quantity"
                type="number"
                min="0.001"
                step="0.001"
                value="0.250"
            >

        </div>


        <div class="field">

            <label>Price / KG</label>

            <input
                id="price"
                type="text"
                readonly
                placeholder="₹0.00"
            >

        </div>


        <button
            class="add-btn"
            type="button"
            onclick="addItem()"
        >
            + Add
        </button>


    </div>


    <div class="quick-label">
        Quick Quantity
    </div>


    <div class="quick">

        <button onclick="setQty(.250)">
            250g
        </button>

        <button onclick="setQty(.500)">
            500g
        </button>

        <button onclick="setQty(.750)">
            750g
        </button>

        <button onclick="setQty(1)">
            1 KG
        </button>

        <button onclick="setQty(2)">
            2 KG
        </button>

    </div>

</section>


<!-- BILL -->

<section class="card">

    <h2>🧾 Current Bill</h2>

    <div id="billTable">

        <div class="empty">
            No sweets added yet.
        </div>

    </div>

</section>


<!-- PAYMENT -->

<section class="card">

    <h2>💰 Payment</h2>


    <div class="payment-layout">

        <div class="summary">

            <div class="row">

                <span>Subtotal</span>

                <strong id="subtotal">
                    ₹0.00
                </strong>

            </div>


            <div class="row">

                <span>Discount</span>

                <input
                    id="discount"
                    class="discount-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                >

            </div>


            <div class="row total">

                <span>TOTAL</span>

                <strong id="grandTotal">
                    ₹0.00
                </strong>

            </div>

        </div>

    </div>


    <div class="payment-methods">

        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Cash"
                checked
            >

            💵 Cash

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Card"
            >

            💳 Card

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="UPI"
            >

            📱 UPI

        </label>

    </div>


    <button
        class="save"
        id="saveButton"
        onclick="saveBill()"
    >
        🧾 SAVE BILL
    </button>


    <div
        id="message"
        class="message">
    </div>

</section>


</main>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   APP DATA
===================================================== */

let products = [];

let cart = [];


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        updateClock();

        generateBillNumber();

        loadProducts();

    }
);


setInterval(
    updateClock,
    1000
);


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();

    document.getElementById(
        "billDate"
    ).textContent =
        now.toLocaleDateString(
            "en-IN"
        );

    document.getElementById(
        "billTime"
    ).textContent =
        now.toLocaleTimeString(
            "en-IN"
        );

}


/* =====================================================
   BILL NUMBER
===================================================== */

function generateBillNumber(){

    const now =
        new Date();

    const date =
        now.getFullYear() +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        String(
            now.getDate()
        ).padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    document.getElementById(
        "billNumber"
    ).textContent =
        "RS-" +
        date +
        "-" +
        random;

}


/* =====================================================
   LOAD PRODUCTS FROM SUPABASE
===================================================== */

async function loadProducts(){

    const select =
        document.getElementById(
            "productSelect"
        );

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "🔄 Loading sweets...";


    select.innerHTML =
        `<option value="">
            Loading sweets...
         </option>`;


    try{

        const endpoint =
            SUPABASE_URL +
            "/rest/v1/products" +
            "?select=id,name,price_per_kg,stock_kg" +
            "&order=name.asc";


        const response =
            await fetch(
                endpoint,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"
                    }
                }
            );


        const text =
            await response.text();


        console.log(
            "PRODUCT RESPONSE:",
            text
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " | " +
                text
            );

        }


        products =
            JSON.parse(text);


        if(!Array.isArray(products)){

            throw new Error(
                "Invalid products response"
            );

        }


        products.sort(
            function(a,b){

                return String(
                    a.name
                ).localeCompare(
                    String(b.name)
                );

            }
        );


        select.innerHTML =
            `<option value="">
                Select Sweet
             </option>`;


        products.forEach(
            function(product){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    product.id;


                option.textContent =
                    String(product.name) +
                    " — ₹" +
                    money(
                        product.price_per_kg
                    ) +
                    "/KG — Stock: " +
                    kg(
                        product.stock_kg
                    ) +
                    " KG";


                select.appendChild(
                    option
                );

            }
        );


        status.textContent =
            "✅ " +
            products.length +
            " sweets loaded successfully";


        showMessage(
            "Sweets loaded successfully.",
            true
        );


        setTimeout(
            function(){

                document.getElementById(
                    "message"
                ).style.display =
                    "none";

            },
            2500
        );


    }
    catch(error){

        console.error(
            "PRODUCT LOAD ERROR:",
            error
        );


        select.innerHTML =
            `<option value="">
                ❌ Failed to load sweets
             </option>`;


        status.textContent =
            "❌ Database connection failed";


        showMessage(
            "❌ " +
            error.message,
            false
        );

    }

}


/* =====================================================
   SELECT SWEET
===================================================== */

document.getElementById(
    "productSelect"
).addEventListener(
    "change",
    function(){

        const product =
            products.find(
                function(item){

                    return String(
                        item.id
                    ) ===
                    String(
                        this.value
                    );

                },
                this
            );


        if(product){

            document.getElementById(
                "price"
            ).value =
                "₹" +
                money(
                    product.price_per_kg
                );

        }
        else{

            document.getElementById(
                "price"
            ).value =
                "";

        }

    }
);


/* =====================================================
   QUICK QUANTITY
===================================================== */

function setQty(value){

    document.getElementById(
        "quantity"
    ).value =
        Number(value).toFixed(3);

}


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(){

    const productId =
        document.getElementById(
            "productSelect"
        ).value;


    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value
        );


    if(!productId){

        alert(
            "First sweet select cheyyi."
        );

        return;

    }


    if(!quantity || quantity <= 0){

        alert(
            "Valid quantity enter cheyyi."
        );

        return;

    }


    const product =
        products.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(productId);

            }
        );


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    const stock =
        Number(
            product.stock_kg
        ) || 0;


    if(stock <= 0){

        alert(
            "This sweet is out of stock."
        );

        return;

    }


    const existing =
        cart.find(
            function(item){

                return String(
                    item.product_id
                ) ===
                String(product.id);

            }
        );


    if(existing){

        const newQuantity =
            existing.quantity_kg +
            quantity;


        if(newQuantity > stock){

            alert(
                "Available stock: " +
                kg(stock) +
                " KG"
            );

            return;

        }


        existing.quantity_kg =
            newQuantity;


        existing.item_total =
            newQuantity *
            existing.price_per_kg;

    }
    else{

        cart.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity_kg:
                quantity,

            price_per_kg:
                Number(
                    product.price_per_kg
                ) || 0,

            item_total:
                quantity *
                (
                    Number(
                        product.price_per_kg
                    ) || 0
                )

        });

    }


    renderBill();

}


/* =====================================================
   RENDER BILL
===================================================== */

function renderBill(){

    const container =
        document.getElementById(
            "billTable"
        );


    if(cart.length === 0){

        container.innerHTML =
            `<div class="empty">
                No sweets added yet.
             </div>`;

        calculateTotal();

        return;

    }


    let html = `

        <div class="table-container">

        <table>

        <thead>

        <tr>

            <th>S.No</th>

            <th>Sweet</th>

            <th>Qty</th>

            <th>Price/KG</th>

            <th>Total</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

    `;


    cart.forEach(
        function(item,index){

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.product_name
                        )}
                    </td>

                    <td>
                        ${kg(
                            item.quantity_kg
                        )} KG
                    </td>

                    <td>
                        ₹${money(
                            item.price_per_kg
                        )}
                    </td>

                    <td>
                        ₹${money(
