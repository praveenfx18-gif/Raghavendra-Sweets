<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets | Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --maroon:#68140e;
    --dark:#350805;
    --gold:#d5a52b;
    --light:#fff8e8;
    --cream:#fffaf0;
    --text:#3d160f;
    --border:#ead49a;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f3dfaa);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,var(--maroon),var(--dark));
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:50%;
    background:white;
    padding:3px;
    border:2px solid var(--gold);
}

.brand h1{
    color:#ffd95a;
    font-size:23px;
}

.brand p{
    color:#fff1bb;
    font-size:13px;
    margin-top:4px;
}

.bill-top{
    text-align:right;
}

.bill-top span{
    display:block;
    font-size:12px;
    color:#ffe9a3;
}

.bill-top strong{
    font-size:16px;
}

/* LAYOUT */

.container{
    max-width:1250px;
    margin:20px auto;
    padding:0 15px;
}

.main-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 390px;
    gap:20px;
    align-items:start;
}

/* CARDS */

.card{
    background:rgba(255,255,255,.96);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(70,30,10,.12);
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.section-title h2{
    color:var(--maroon);
    font-size:20px;
}

.count{
    background:var(--light);
    color:var(--maroon);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:6px 11px;
    font-size:12px;
    font-weight:bold;
}

/* SEARCH */

.search-box{
    position:relative;
    margin-bottom:13px;
}

.search-box input{
    width:100%;
    padding:14px 45px 14px 15px;
    border:1px solid #d8bd70;
    border-radius:12px;
    background:#fffdf7;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:var(--maroon);
    box-shadow:0 0 0 3px rgba(104,20,14,.08);
}

.search-icon{
    position:absolute;
    right:15px;
    top:13px;
    font-size:20px;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:7px;
    margin-bottom:14px;
}

.category-btn{
    flex:0 0 auto;
    padding:8px 13px;
    border-radius:20px;
    border:1px solid #d9bd6c;
    background:#fffaf0;
    color:var(--maroon);
    font-weight:bold;
    cursor:pointer;
}

.category-btn.active,
.category-btn:hover{
    background:var(--maroon);
    color:white;
}

/* PRODUCT GRID */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.product{
    border:1px solid #ead7a5;
    border-radius:15px;
    overflow:hidden;
    background:#fffdf7;
    transition:.2s;
    display:flex;
    flex-direction:column;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(80,30,10,.14);
}

.product-image{
    height:145px;
    width:100%;
    object-fit:cover;
    background:linear-gradient(135deg,#fff0bf,#ead08a);
}

.image-placeholder{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    background:linear-gradient(135deg,#fff1bd,#e7ca80);
}

.product-body{
    padding:12px;
}

.product-name{
    font-weight:bold;
    color:var(--maroon);
    font-size:15px;
    min-height:36px;
}

.product-price{
    margin-top:5px;
    font-weight:bold;
    font-size:15px;
}

.product-stock{
    margin-top:4px;
    font-size:12px;
    color:#746354;
}

.add-product{
    width:100%;
    margin-top:9px;
    background:var(--maroon);
    color:white;
    padding:10px;
}

.add-product:hover{
    background:#8b2118;
}

.no-products{
    grid-column:1/-1;
    padding:35px;
    text-align:center;
    color:#8a7767;
}

/* BILL */

.bill-card{
    position:sticky;
    top:105px;
}

.bill-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
}

.info{
    background:var(--light);
    border:1px solid #e6cc82;
    padding:10px;
    border-radius:10px;
}

.info small{
    display:block;
    color:#80604b;
    font-size:11px;
}

.info strong{
    display:block;
    margin-top:4px;
    color:var(--maroon);
    font-size:13px;
}

/* BILL ITEMS */

.bill-items{
    max-height:330px;
    overflow-y:auto;
    margin-top:10px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#8a7767;
}

.bill-item{
    padding:12px 0;
    border-bottom:1px solid #eee0b9;
}

.item-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    font-weight:bold;
    color:var(--maroon);
}

.item-total{
    font-weight:bold;
}

.item-details{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:7px;
    font-size:12px;
    color:#76675b;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:5px;
}

.qty-btn{
    width:27px;
    height:27px;
    padding:0;
    border-radius:7px;
    background:#fff2c9;
    color:var(--maroon);
    border:1px solid #dfc16a;
}

.remove{
    color:#b3261e;
    cursor:pointer;
    font-weight:bold;
}

/* TOTAL */

.total-box{
    margin-top:14px;
    padding-top:10px;
    border-top:2px dashed #d7bd70;
}

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
}

.discount-input{
    width:100px;
    padding:8px;
    border:1px solid #d2b35d;
    border-radius:7px;
    text-align:right;
}

.grand-total{
    margin-top:5px;
    padding-top:12px;
    border-top:1px solid #ead9aa;
    color:var(--maroon);
    font-size:23px;
    font-weight:bold;
}

/* PAYMENT */

.payment-title{
    margin-top:14px;
    margin-bottom:8px;
    font-size:13px;
    font-weight:bold;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.payment label{
    padding:10px 5px;
    text-align:center;
    border:1px solid #dfc475;
    border-radius:9px;
    background:#fffaf0;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.payment label:has(input:checked){
    background:var(--maroon);
    color:white;
    border-color:var(--maroon);
}

.payment input{
    display:none;
}

/* SAVE */

.save-btn{
    width:100%;
    margin-top:13px;
    padding:15px;
    border-radius:11px;
    background:linear-gradient(135deg,#8a5700,#d5a52b);
    color:white;
    font-size:17px;
    font-weight:bold;
}

.save-btn:hover{
    filter:brightness(1.05);
}

.save-btn:disabled{
    opacity:.6;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    word-break:break-word;
}

.success{
    display:block;
    background:#e6f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe2df;
    color:#8b1a13;
}

/* MOBILE */

@media(max-width:950px){

    .main-grid{
        grid-template-columns:1fr;
    }

    .bill-card{
        position:static;
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){

    .header{
        padding:12px;
    }

    .header-inner{
        align-items:flex-start;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .brand h1{
        font-size:17px;
    }

    .brand p{
        font-size:11px;
    }

    .bill-top{
        font-size:11px;
    }

    .container{
        margin-top:12px;
        padding:0 9px;
    }

    .card{
        padding:13px;
        border-radius:14px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .product-image,
    .image-placeholder{
        height:115px;
    }

    .product-body{
        padding:9px;
    }

    .product-name{
        font-size:13px;
    }

    .product-price{
        font-size:13px;
    }

    .add-product{
        padding:9px 5px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <img
                src="logo.jpg"
                class="logo"
                alt="Raghavendra Sweets Logo"
                onerror="this.style.display='none';">

            <div>
                <h1>RAGHAVENDRA SWEETS</h1>
                <p>Premium Billing System</p>
            </div>

        </div>

        <div class="bill-top">
            <span>Current Bill</span>
            <strong id="topBillNo">--</strong>
        </div>

    </div>

</header>


<main class="container">

<div class="main-grid">


<!-- =========================================
     PRODUCTS
========================================= -->

<section>

<div class="card">

    <div class="section-title">

        <h2>🍬 Select Sweets</h2>

        <span class="count">
            <span id="productCount">0</span> Items
        </span>

    </div>


    <div class="search-box">

        <input
            type="search"
            id="search"
            placeholder="Search sweets..."
            autocomplete="off">

        <span class="search-icon">🔎</span>

    </div>


    <div
        class="categories"
        id="categories">

        <button
            class="category-btn active"
            data-category="All">

            All

        </button>

        <button
            class="category-btn"
            data-category="Kaju">

            Kaju

        </button>

        <button
            class="category-btn"
            data-category="Laddu">

            Laddu

        </button>

        <button
            class="category-btn"
            data-category="Milk">

            Milk Sweets

        </button>

        <button
            class="category-btn"
            data-category="Halwa">

            Halwa

        </button>

        <button
            class="category-btn"
            data-category="Other">

            Others

        </button>

    </div>


    <div
        id="products"
        class="products">

        <div class="no-products">
            ⏳ Loading sweets...
        </div>

    </div>

</div>

</section>


<!-- =========================================
     BILL
========================================= -->

<aside>

<div class="card bill-card">

    <div class="section-title">

        <h2>🧾 Current Bill</h2>

        <span
            class="count"
            id="cartCount">

            0 Items

        </span>

    </div>


    <div class="bill-info">

        <div class="info">

            <small>Bill Number</small>

            <strong id="billNo">
                --
            </strong>

        </div>

        <div class="info">

            <small>Date</small>

            <strong id="billDate">
                --
            </strong>

        </div>

        <div class="info">

            <small>Time</small>

            <strong id="billTime">
                --
            </strong>

        </div>

        <div class="info">

            <small>Items</small>

            <strong id="itemCount">
                0
            </strong>

        </div>

    </div>


    <div
        id="billItems"
        class="bill-items">

        <div class="empty">

            🛒<br><br>
            No sweets added yet.

        </div>

    </div>


    <div class="total-box">

        <div class="total-row">

            <span>Subtotal</span>

            <strong id="subtotal">
                ₹0.00
            </strong>

        </div>


        <div class="total-row">

            <span>Discount</span>

            <input
                type="number"
                id="discount"
                class="discount-input"
                value="0"
                min="0"
                step="1">

        </div>


        <div class="total-row grand-total">

            <span>TOTAL</span>

            <span id="grandTotal">
                ₹0.00
            </span>

        </div>

    </div>


    <div class="payment-title">
        Payment Method
    </div>


    <div class="payment">

        <label>

            <input
                type="radio"
                name="payment"
                value="Cash"
                checked>

            💵 Cash

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Card">

            💳 Card

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="UPI">

            📱 UPI

        </label>

    </div>


    <button
        class="save-btn"
        id="saveBtn">

        🧾 SAVE BILL

    </button>


    <div
        id="message"
        class="message">
    </div>

</div>

</aside>

</div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let cart = [];

let currentCategory = "All";


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        createBillNumber();

        updateClock();

        setInterval(
            updateClock,
            1000
        );

        loadProducts();

        document
            .getElementById("search")
            .addEventListener(
                "input",
                renderProducts
            );

        document
            .getElementById("discount")
            .addEventListener(
                "input",
                calculateTotal
            );

        document
            .getElementById("saveBtn")
            .addEventListener(
                "click",
                saveBill
            );

        document
            .getElementById("categories")
            .addEventListener(
                "click",
                categoryClick
            );

    }
);


/* =====================================================
   BILL NUMBER
===================================================== */

function createBillNumber(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    const bill =
        `RS-${year}${month}${day}-${random}`;

    document.getElementById(
        "billNo"
    ).textContent =
        bill;

    document.getElementById(
        "topBillNo"
    ).textContent =
        bill;

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();

    document.getElementById(
        "billDate"
    ).textContent =
        now.toLocaleDateString(
            "en-IN"
        );

    document.getElementById(
        "billTime"
    ).textContent =
        now.toLocaleTimeString(
            "en-IN"
        );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const box =
        document.getElementById(
            "products"
        );

    box.innerHTML =
        `<div class="no-products">
            ⏳ Loading sweets...
         </div>`;


    try{

        const response =
            await fetch(

                `${SUPABASE_URL}/rest/v1/products?select=id,name,price_per_kg,stock_kg,active,image_url&order=name.asc`,

                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`
                    }

                }

            );


        const text =
            await response.text();


        console.log(
            "PRODUCT RESPONSE:",
            response.status,
            text
        );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}: ${text}`
            );

        }


        products =
            JSON.parse(text);


        if(!Array.isArray(products)){

            throw new Error(
                "Invalid products response."
            );

        }


        document.getElementById(
            "productCount"
        ).textContent =
            products.length;


        renderProducts();


    }
    catch(error){

        console.error(error);


        box.innerHTML =
            `<div class="no-products">
                ❌ Products load avvaledu.<br><br>
                ${escapeHtml(error.message)}
             </div>`;

    }

}


/* =====================================================
   CATEGORY
===================================================== */

function categoryClick(event){

    const button =
        event.target.closest(
            ".category-btn"
        );


    if(!button){
        return;
    }


    currentCategory =
        button.dataset.category;


    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    renderProducts();

}


/* =====================================================
   CATEGORY MATCH
===================================================== */

function categoryMatch(
    product
){

    if(currentCategory === "All"){
        return true;
    }


    const name =
        String(
            product.name || ""
        ).toLowerCase();


    if(currentCategory === "Kaju"){

        return name.includes("kaju");

    }


    if(currentCategory === "Laddu"){

        return name.includes("laddu");

    }


    if(currentCategory === "Milk"){

        return (
            name.includes("peda") ||
            name.includes("milk") ||
            name.includes("rasmalai") ||
            name.includes("rasgulla") ||
            name.includes("gulab")
        );

    }


    if(currentCategory === "Halwa"){

        return name.includes("halwa");

    }


    if(currentCategory === "Other"){

        return (
            !name.includes("kaju") &&
            !name.includes("laddu") &&
            !name.includes("peda") &&
            !name.includes("milk") &&
            !name.includes("rasmalai") &&
            !name.includes("rasgulla") &&
            !name.includes("gulab") &&
            !name.includes("halwa")
        );

    }


    return true;

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const box =
        document.getElementById(
            "products"
        );


    const search =
        document.getElementById(
            "search"
