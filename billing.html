<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Raghavendra Sweets - Billing</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f1dda5);
    color:#3d160f;
}

header{
    background:linear-gradient(135deg,#68140e,#350805);
    color:white;
    padding:15px;
    text-align:center;
    box-shadow:0 4px 15px #0003;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    padding:3px;
    border:2px solid #d5a52b;
}

header h1{
    color:#ffd95a;
    margin-top:7px;
    font-size:23px;
}

header p{
    color:#ffeeb0;
    margin-top:4px;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 12px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:18px;
}

.card{
    background:white;
    border:1px solid #e2c16c;
    border-radius:16px;
    padding:16px;
    margin-bottom:18px;
    box-shadow:0 5px 20px #5a250e18;
}

h2{
    color:#68140e;
    margin-bottom:14px;
    font-size:20px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #cdaa50;
    border-radius:10px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.product{
    border:1px solid #ead49b;
    border-radius:13px;
    overflow:hidden;
    background:#fffdf7;
}

.product-img{
    width:100%;
    height:125px;
    object-fit:cover;
    background:#f4df9e;
}

.placeholder{
    width:100%;
    height:125px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    background:linear-gradient(135deg,#fff1c4,#e8cd83);
}

.product-info{
    padding:10px;
}

.product-name{
    font-weight:bold;
    color:#68140e;
    min-height:34px;
}

.price{
    margin-top:5px;
    font-weight:bold;
}

.stock{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.add{
    width:100%;
    margin-top:8px;
    padding:9px;
    border:0;
    border-radius:8px;
    background:#68140e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.add:active{
    transform:scale(.97);
}

.bill-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:12px;
}

.info{
    background:#fff8e5;
    border:1px solid #e5c978;
    padding:9px;
    border-radius:8px;
}

.info small{
    display:block;
    color:#80604b;
    font-size:11px;
}

.info strong{
    display:block;
    margin-top:3px;
    color:#68140e;
    font-size:13px;
}

.bill-items{
    max-height:350px;
    overflow-y:auto;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#887768;
}

.item{
    border-bottom:1px solid #eadbb5;
    padding:11px 0;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.item-name{
    font-weight:bold;
    color:#68140e;
}

.item-total{
    font-weight:bold;
}

.item-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:7px;
    font-size:12px;
}

.qty{
    display:flex;
    align-items:center;
    gap:5px;
}

.qty button{
    width:27px;
    height:27px;
    border:1px solid #d8bb65;
    border-radius:6px;
    background:#fff3ca;
    color:#68140e;
    font-weight:bold;
}

.remove{
    color:#b3261e;
    font-weight:bold;
    cursor:pointer;
}

.summary{
    border-top:2px dashed #d8bd6a;
    margin-top:12px;
    padding-top:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
}

.discount{
    width:90px;
    padding:8px;
    border:1px solid #cdaa50;
    border-radius:7px;
    text-align:right;
}

.total{
    color:#68140e;
    font-size:23px;
    font-weight:bold;
    border-top:1px solid #ead9aa;
    margin-top:5px;
    padding-top:12px;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:10px;
}

.payment label{
    text-align:center;
    padding:10px 4px;
    border:1px solid #dfc475;
    border-radius:8px;
    background:#fffaf0;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.payment input{
    display:none;
}

.payment label:has(input:checked){
    background:#68140e;
    color:white;
}

.save{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#8b5a00,#d5a52b);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    display:none;
}

.success{
    display:block;
    background:#e5f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

@media(max-width:850px){
    .layout{grid-template-columns:1fr}
    .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){
    .products{grid-template-columns:repeat(2,1fr)}
    .product-img,.placeholder{height:110px}
}

@media(max-width:380px){
    .products{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>

<img src="logo.jpg" class="logo" alt="Raghavendra Sweets Logo">

<h1>RAGHAVENDRA SWEETS</h1>
<p>Smart Billing System</p>

</header>

<div class="container">

<div class="layout">

<!-- PRODUCTS -->

<div>

<div class="card">

<h2>🍬 Sweets</h2>

<input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Search sweet..."
>

<div id="products" class="products">
    <div class="empty">Loading sweets...</div>
</div>

</div>

</div>


<!-- BILL -->

<div>

<div class="card">

<h2>🧾 Current Bill</h2>

<div class="bill-info">

<div class="info">
<small>Bill Number</small>
<strong id="billNo">--</strong>
</div>

<div class="info">
<small>Date</small>
<strong id="date">--</strong>
</div>

<div class="info">
<small>Time</small>
<strong id="time">--</strong>
</div>

<div class="info">
<small>Items</small>
<strong id="itemCount">0</strong>
</div>

</div>


<div id="billItems" class="bill-items">

<div class="empty">
🛒<br><br>
No sweets added
</div>

</div>


<div class="summary">

<div class="row">
<span>Subtotal</span>
<strong id="subtotal">₹0.00</strong>
</div>

<div class="row">
<span>Discount</span>

<input
    id="discount"
    class="discount"
    type="number"
    value="0"
    min="0"
>
</div>

<div class="row total">
<span>TOTAL</span>
<strong id="total">₹0.00</strong>
</div>

</div>


<div style="margin-top:12px;font-weight:bold;font-size:13px">
Payment Method
</div>

<div class="payment">

<label>
<input type="radio" name="payment" value="Cash" checked>
💵 Cash
</label>

<label>
<input type="radio" name="payment" value="Card">
💳 Card
</label>

<label>
<input type="radio" name="payment" value="UPI">
📱 UPI
</label>

</div>


<button id="save" class="save">
🧾 SAVE BILL
</button>

<div id="message" class="message"></div>

</div>

</div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* ================================
   DATA
================================ */

let products = [];
let cart = [];


/* ================================
   START
================================ */

document.addEventListener(
"DOMContentLoaded",
function(){

    generateBill();

    updateTime();

    setInterval(updateTime,1000);

    loadProducts();

    document
    .getElementById("search")
    .addEventListener(
        "input",
        renderProducts
    );

    document
    .getElementById("discount")
    .addEventListener(
        "input",
        calculate
    );

    document
    .getElementById("save")
    .addEventListener(
        "click",
        saveBill
    );

});


/* ================================
   BILL NUMBER
================================ */

function generateBill(){

    const now = new Date();

    const date =
        now.getFullYear() +
        String(now.getMonth()+1).padStart(2,"0") +
        String(now.getDate()).padStart(2,"0");

    const random =
        Math.floor(
            1000 + Math.random()*9000
        );

    document.getElementById("billNo")
    .textContent =
    `RS-${date}-${random}`;

}


/* ================================
   TIME
================================ */

function updateTime(){

    const now = new Date();

    document.getElementById("date")
    .textContent =
    now.toLocaleDateString("en-IN");

    document.getElementById("time")
    .textContent =
    now.toLocaleTimeString("en-IN");

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/products?select=id,name,price_per_kg,stock_kg,active,image_url&active=eq.true&order=name.asc",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        products =
        await response.json();


        renderProducts();

    }
    catch(error){

        console.error(error);

        document.getElementById("products")
        .innerHTML =
        `
        <div class="empty">
        ❌ Products load avvaledu.<br><br>
        ${escapeHtml(error.message)}
        </div>
        `;

    }

}


/* ================================
   RENDER PRODUCTS
================================ */

function renderProducts(){

    const box =
    document.getElementById("products");

    const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();


    const filtered =
    products.filter(
        function(product){

            return String(
                product.name
            )
            .toLowerCase()
            .includes(search);

        }
    );


    if(filtered.length === 0){

        box.innerHTML =
        `
        <div class="empty">
        😔 Sweet dorakaledu
        </div>
        `;

        return;

    }


    box.innerHTML = "";


    filtered.forEach(
        function(product){

            const card =
            document.createElement("div");

            card.className =
            "product";


            const price =
            Number(product.price_per_kg) || 0;

            const stock =
            Number(product.stock_kg) || 0;


            let image;

            if(product.image_url){

                image =
                `
                <img
                    src="${escapeAttribute(product.image_url)}"
                    class="product-img"
                    alt="${escapeAttribute(product.name)}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                >
                <div
                    class="placeholder"
                    style="display:none">
                    🍬
                </div>
                `;

            }
            else{

                image =
                `
                <div class="placeholder">
                    🍬
                </div>
                `;

            }


            card.innerHTML =
            `
            ${image}

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="price">
                    ₹${price.toFixed(2)} / KG
                </div>

                <div class="stock">
                    Stock: ${stock.toFixed(3)} KG
                </div>

                <button
                    class="add"
                    onclick="addItem(${Number(product.id)})">

                    + ADD 250g

                </button>

            </div>
            `;


            box.appendChild(card);

        }
    );

}


/* ================================
   ADD ITEM
================================ */

function addItem(id){

    const product =
    products.find(
        p => Number(p.id) === Number(id)
    );


    if(!product){

        alert("Product not found");
        return;

    }


    const stock =
    Number(product.stock_kg) || 0;


    if(stock < 0.250){

        alert(
            `Available stock: ${stock.toFixed(3)} KG`
        );

        return;

    }


    const existing =
    cart.find(
        item =>
        Number(item.product_id) === Number(id)
    );


    if(existing){

        if(
            existing.quantity_kg + 0.250
            > stock
        ){

            alert(
                `Available stock: ${stock.toFixed(3)} KG`
            );

            return;

        }


        existing.quantity_kg += 0.250;

        existing.item_total =
        existing.quantity_kg *
        existing.price_per_kg;

    }
    else{

        cart.push({

            product_id:
            product.id,

            product_name:
            product.name,

            quantity_kg:
            0.250,

            price_per_kg:
            Number(product.price_per_kg) || 0,

            item_total:
            0.250 *
            (Number(product.price_per_kg) || 0)

        });

    }


    renderBill();

}


/* ================================
   CHANGE QTY
================================ */

function changeQty(index,amount){

    const item = cart[index];

    if(!item) return;


    const product =
    products.find(
        p =>
        Number(p.id) ===
        Number(item.product_id)
    );


    const stock =
    Number(product?.stock_kg) || 0;


    let quantity =
    item.quantity_kg + amount;


    if(quantity < 0.250){

        cart.splice(index,1);

        renderBill();

        return;

    }


    if(quantity > stock){

        alert(
            `Available stock: ${stock.toFixed(3)} KG`
        );

        return;

    }


    item.quantity_kg =
    Number(quantity.toFixed(3));


    item.item_total =
    item.quantity_kg *
    item.price_per_kg;


    renderBill();

}


/* ================================
   REMOVE
================================ */

function removeItem(index){

    cart.splice(index,1);

    renderBill();

}


/* ================================
   RENDER BILL
================================ */

function renderBill(){

    const box =
    document.getElementById("billItems");


    document.getElementById("itemCount")
    .textContent =
    cart.length;


    if(cart.length === 0){

        box.innerHTML =
        `
        <div class="empty">
        🛒<br><br>
        No sweets added
        </div>
        `;

        calculate();

        return;

    }


    box.innerHTML = "";


    cart.forEach(
        function(item,index){

            const div =
            document.createElement("div");

            div.className =
            "item";


            div.innerHTML =
            `
            <div class="item-top">

                <span class="item-name">
                    ${escapeHtml(item.product_name)}
                </span>

                <span class="item-total">
                    ₹${item.item_total.toFixed(2)}
                </span>

            </div>

            <div class="item-bottom">

                <span>
                    ₹${item.price_per_kg.toFixed(2)}/KG
                </span>

                <div class="qty">

                    <button
                        onclick="changeQty(${index},-0.250)">
                        −
                    </button>

                    <strong>
                        ${item.quantity_kg.toFixed(3)} KG
                    </strong>

                    <button
                        onclick="changeQty(${index},0.250)">
                        +
                    </button>

                </div>

                <span
                    class="remove"
                    onclick="removeItem(${index})">
                    Remove
                </span>

            </div>
            `;


            box.appendChild(div);

        }
    );


    calculate();

}


/* ================================
   CALCULATE
================================ */

function calculate(){

    const subtotal =
    cart.reduce(
        (sum,item) =>
        sum + item.item_total,
        0
    );


    let discount =
    Number(
        document.getElementById("discount").value
    ) || 0;


    if(discount < 0)
        discount = 0;


    if(discount > subtotal)
        discount = subtotal;


    document.getElementById("subtotal")
    .textContent =
    `₹${subtotal.toFixed(2)}`;


    document.getElementById("total")
    .textContent =
    `₹${(subtotal-discount).toFixed(2)}`;

}


/* ================================
   SAVE BILL
================================ */

async function saveBill(){

    if(cart.length === 0){

        showMessage(
            "❌ First sweet add cheyyi.",
            false
        );

        return;

    }


    const subtotal =
    cart.reduce(
        (sum,item) =>
        sum + item.item_total,
        0
    );


    let discount =
    Number(
        document.getElementById("discount").value
    ) || 0;


    if(discount > subtotal)
        discount = subtotal;


    const total =
    subtotal - discount;


    const payment =
    document.querySelector(
        'input[name="payment"]:checked'
    )?.value || "Cash";


    const billNo =
    document.getElementById("billNo")
    .textContent;


    const button =
    document.getElementById("save");


    button.disabled = true;

    button.textContent =
    "⏳ Saving...";


    try{

        /* SAVE SALE */

        const saleResponse =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/sales",
            {
                method:"POST",

                headers:{
                    "apikey":SUPABASE_KEY,

                    "Authorization":
                    "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=representation"
                },

                body:JSON.stringify({

                    bill_no:billNo,

                    subtotal:
                    Number(subtotal.toFixed(2)),

                    discount:
                    Number(discount.toFixed(2)),

                    total:
                    Number(total.toFixed(2)),

                    payment_method:
                    payment

                })
            }
        );


        const saleText =
        await saleResponse.text();


        if(!saleResponse.ok){

            throw new Error(
                saleText
            );

        }


        const sale =
        JSON.parse(saleText);


        const saleId =
        sale[0].id;


        /* SAVE ITEMS */

        const itemData =
        cart.map(
            item => ({

                sale_id:
                saleId,

                product_id:
                item.product_id,

                product_name:
                item.product_name,

                quantity_kg:
                Number(
                    item.quantity_kg.toFixed(3)
                ),

                price_per_kg:
                Number(
                    item.price_per_kg.toFixed(2)
                ),

                item_total:
                Number(
                    item.item_total.toFixed(2)
                )

            })
        );


        const itemResponse =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/sale_items",
            {
                method:"POST",
