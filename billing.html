<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f1d99a);
    color:#3d160f;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#68140e,#350604);
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,.3);
}

.logo{
    width:82px;
    height:82px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d5a52b;
    background:white;
    padding:3px;
}

.header h1{
    margin-top:8px;
    color:#ffd95a;
    font-size:25px;
}

.header p{
    margin-top:5px;
    color:#fff0b5;
}

.container{
    width:95%;
    max-width:1100px;
    margin:22px auto;
}

.card{
    background:rgba(255,255,255,.97);
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(70,30,10,.15);
    border:1px solid #dfc16a;
}

.bill-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.info-box{
    background:#fff9e8;
    padding:14px;
    border-radius:10px;
    border:1px solid #e5c66e;
}

.info-box small{
    color:#80604b;
}

.info-box strong{
    display:block;
    margin-top:5px;
    font-size:17px;
}

h2{
    color:#68140e;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
}

label{
    font-size:14px;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #c9a34d;
    border-radius:8px;
    outline:none;
    font-size:15px;
    background:#fffdf7;
}

select:focus,
input:focus{
    border-color:#68140e;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn{
    background:#68140e;
    color:white;
}

.add-btn:hover{
    background:#8b2118;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    min-width:650px;
}

th{
    background:#68140e;
    color:#ffd95a;
    padding:12px;
}

td{
    padding:11px;
    border-bottom:1px solid #ead9aa;
    text-align:center;
}

.remove-btn{
    background:#b3261e;
    color:white;
    padding:7px 12px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#8a7767;
}

.summary{
    display:flex;
    justify-content:flex-end;
}

.summary-box{
    width:350px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #ead9aa;
}

.grand-total{
    font-size:23px;
    font-weight:bold;
    color:#68140e;
    border-bottom:none;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.payment label{
    border:2px solid #e1c36c;
    padding:14px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    background:#fffaf0;
}

.payment input{
    width:auto;
    margin-right:7px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    font-size:18px;
    background:linear-gradient(135deg,#8b5a00,#d5a52b);
    color:white;
}

.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e4f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

.loading{
    color:#68140e;
    font-weight:bold;
}

.status{
    text-align:center;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    background:#fff8df;
    color:#68140e;
    font-weight:bold;
}

@media(max-width:700px){

    .bill-info{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary{
        justify-content:stretch;
    }

    .summary-box{
        width:100%;
    }

    .payment{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:21px;
    }

}
</style>
</head>

<body>

<header class="header">

    <img
        src="logo.jpg"
        class="logo"
        alt="Raghavendra Sweets Logo"
    >

    <h1>RAGHAVENDRA SWEETS</h1>

    <p>Billing System</p>

</header>


<main class="container">

<div id="connectionStatus" class="status">
    Connecting to billing database...
</div>


<!-- BILL INFO -->

<div class="card">

    <div class="bill-info">

        <div class="info-box">
            <small>Bill Number</small>
            <strong id="billNumber">Generating...</strong>
        </div>

        <div class="info-box">
            <small>Date</small>
            <strong id="billDate">--</strong>
        </div>

        <div class="info-box">
            <small>Time</small>
            <strong id="billTime">--</strong>
        </div>

    </div>

</div>


<!-- ADD SWEET -->

<div class="card">

    <h2>🍬 Add Sweet</h2>

    <div class="form-grid">

        <div>

            <label>Select Sweet</label>

            <select id="productSelect">

                <option value="">
                    Loading sweets...
                </option>

            </select>

        </div>


        <div>

            <label>Quantity (KG)</label>

            <input
                type="number"
                id="quantity"
                min="0.001"
                step="0.001"
                value="0.250"
            >

        </div>


        <div>

            <label>Price / KG</label>

            <input
                type="text"
                id="price"
                readonly
                placeholder="₹0.00"
            >

        </div>


        <button
            type="button"
            class="add-btn"
            id="addButton"
        >
            + Add
        </button>

    </div>

</div>


<!-- CURRENT BILL -->

<div class="card">

    <h2>🧾 Current Bill</h2>

    <div id="billTable">

        <div class="empty">
            No sweets added yet.
        </div>

    </div>

</div>


<!-- PAYMENT -->

<div class="card">

    <h2>💰 Payment</h2>

    <div class="summary">

        <div class="summary-box">

            <div class="total-row">

                <span>Subtotal</span>

                <strong id="subtotal">
                    ₹0.00
                </strong>

            </div>


            <div class="total-row">

                <span>Discount</span>

                <input
                    type="number"
                    id="discount"
                    min="0"
                    value="0"
                    style="width:120px;text-align:right;"
                >

            </div>


            <div class="total-row grand-total">

                <span>TOTAL</span>

                <strong id="grandTotal">
                    ₹0.00
                </strong>

            </div>

        </div>

    </div>


    <div class="payment">

        <label>

            <input
                type="radio"
                name="payment"
                value="Cash"
                checked
            >

            💵 Cash

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Card"
            >

            💳 Card

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="UPI"
            >

            📱 UPI

        </label>

    </div>


    <button
        type="button"
        class="save-btn"
        id="saveButton"
    >
        🧾 SAVE BILL
    </button>


    <div id="message" class="message"></div>

</div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   VARIABLES
===================================================== */

let products = [];
let cart = [];


/* =====================================================
   ELEMENTS
===================================================== */

const productSelect =
document.getElementById("productSelect");

const quantityInput =
document.getElementById("quantity");

const priceInput =
document.getElementById("price");

const addButton =
document.getElementById("addButton");

const saveButton =
document.getElementById("saveButton");

const discountInput =
document.getElementById("discount");


/* =====================================================
   START
===================================================== */

window.addEventListener("load", function(){

    updateDateTime();

    generateBillNumber();

    loadProducts();

});


/* =====================================================
   DATE + TIME
===================================================== */

function updateDateTime(){

    const now = new Date();

    document.getElementById("billDate")
        .textContent =
        now.toLocaleDateString("en-IN");

    document.getElementById("billTime")
        .textContent =
        now.toLocaleTimeString("en-IN");

}


/* =====================================================
   BILL NUMBER
===================================================== */

function generateBillNumber(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    const bill =
        "RS-" +
        year +
        month +
        day +
        "-" +
        random;

    document.getElementById("billNumber")
        .textContent = bill;

}


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function supabaseHeaders(){

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Accept":
            "application/json"

    };

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    setStatus(
        "Loading sweets from database..."
    );

    productSelect.innerHTML =
        `<option value="">
            Loading sweets...
         </option>`;

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/products" +
            "?select=id,name,price_per_kg,stock_kg" +
            "&order=name.asc";

        console.log(
            "PRODUCT URL:",
            url
        );

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:
                        supabaseHeaders()
                }
            );

        const text =
            await response.text();

        console.log(
            "PRODUCT RESPONSE:",
            text
        );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                text
            );

        }

        products =
            JSON.parse(text);

        if(!Array.isArray(products)){

            throw new Error(
                "Invalid products data"
            );

        }

        productSelect.innerHTML =
            `<option value="">
                Select Sweet
             </option>`;

        products.forEach(function(product){

            const option =
                document.createElement("option");

            option.value =
                product.id;

            option.textContent =
                product.name +
                " — ₹" +
                Number(
                    product.price_per_kg
                ).toFixed(2) +
                "/KG — Stock: " +
                Number(
                    product.stock_kg
                ).toFixed(3) +
                " KG";

            productSelect.appendChild(
                option
            );

        });

        setStatus(
            "✅ " +
            products.length +
            " sweets loaded successfully."
        );

        showMessage(
            "✅ Database connected. " +
            products.length +
            " sweets loaded.",
            true
        );

    }
    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );

        productSelect.innerHTML =
            `<option value="">
                Failed to load sweets
             </option>`;

        setStatus(
            "❌ Database connection failed"
        );

        showMessage(
            "❌ " +
            error.message,
            false
        );

    }

}


/* =====================================================
   PRODUCT CHANGE
===================================================== */

productSelect.addEventListener(
    "change",
    function(){

        const id =
            Number(this.value);

        const product =
            products.find(
                function(item){

                    return Number(item.id)
                        === id;

                }
            );

        if(product){

            priceInput.value =
                "₹" +
                Number(
                    product.price_per_kg
                ).toFixed(2);

        }
        else{

            priceInput.value = "";

        }

    }
);


/* =====================================================
   ADD BUTTON
===================================================== */

addButton.addEventListener(
    "click",
    addItem
);


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(){

    const productId =
        Number(
            productSelect.value
        );

    const quantity =
        Number(
            quantityInput.value
        );

    if(!productId){

        alert(
            "First sweet select cheyyi."
        );

        return;

    }

    if(!quantity || quantity <= 0){

        alert(
            "Valid quantity enter cheyyi."
        );

        return;

    }

    const product =
        products.find(
            function(item){

                return Number(item.id)
                    === productId;

            }
        );

    if(!product){

        alert(
            "Product dorakaledu."
        );

        return;

    }

    const stock =
        Number(product.stock_kg);

    if(quantity > stock){

        alert(
            "Available stock: " +
            stock.toFixed(3) +
            " KG"
        );

        return;

    }

    const existing =
        cart.find(
            function(item){

                return Number(
                    item.product_id
                ) === productId;

            }
        );

    if(existing){

        const newQuantity =
            existing.quantity_kg +
            quantity;

        if(newQuantity > stock){

            alert(
                "Available stock: " +
                stock.toFixed(3) +
                " KG"
            );

            return;

        }

        existing.quantity_kg =
            newQuantity;

        existing.item_total =
            newQuantity *
            existing.price_per_kg;

    }
    else{

        cart.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity_kg:
                quantity,

            price_per_kg:
                Number(
                    product.price_per_kg
                ),

            item_total:
                quantity *
                Number(
                    product.price_per_kg
                )

        });

    }

    quantityInput.value =
        "0.250";

    renderBill();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   RENDER BILL
===================================================== */

function renderBill(){

    const container =
        document.getElementById(
            "billTable"
        );

    if(cart.length === 0){

        container.innerHTML =
            `<div class="empty">
                No sweets added yet.
             </div>`;

        calculateTotal();

        return;

    }

    let html = `
        <div class="table-wrap">

        <table>

        <thead>

        <tr>
            <th>S.No</th>
            <th>Sweet</th>
            <th>Qty KG</th>
            <th>Price/KG</th>
            <th>Total</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>
    `;

    cart.forEach(
        function(item,index){

            html += `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.product_name
                        )}
                    </td>

                    <td>
                        ${Number(
                            item.quantity_kg
                        ).toFixed(3)}
                    </td>

                    <td>
                        ₹${Number(
                            item.price_per_kg
                        ).toFixed(2)}
                    </td>

                    <td>
                        ₹${Number(
                            item.item_total
                        ).toFixed(2)}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="remove-btn"
                            onclick="
                                removeItem(${index})
                            "
                        >
                            Remove
                        </button>

                    </td>

                </tr>
            `;

        }
    );

    html += `
        </tbody>

        </table>

        </div>
    `;

    container.innerHTML =
        html;

    calculateTotal();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index){

    cart.splice(
        index,
        1
    );

    renderBill();

}


/* =====================================================
   DISCOUNT
===================================================== */

discountInput.addEventListener(
    "input",
    calculateTotal
);


/* =====================================================
   TOTAL
===================================================== */

            function(sum,item){

                return sum +

            discountInput.value

    if(discount < 0){

        discount = 0;

    }

    if(discount > subtotal){

        discount = subtotal;

        discountInput.value =

    }

    const total =
