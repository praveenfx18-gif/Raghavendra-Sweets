<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f4dfaa);
    color:#3d160f;
    min-height:100vh;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#68140e,#3c0805);
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.logo{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d5a52b;
    background:white;
    padding:3px;
}

.header h1{
    margin-top:8px;
    color:#ffd95a;
    font-size:25px;
}

.header p{
    margin-top:5px;
    color:#fff0b5;
}

/* CONTAINER */

.container{
    width:95%;
    max-width:1100px;
    margin:25px auto;
}

/* CARD */

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(70,30,10,.15);
    border:1px solid #e2c16c;
}

/* BILL INFO */

.bill-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info-box{
    background:#fff9e8;
    padding:14px;
    border-radius:10px;
    border:1px solid #e5c66e;
}

.info-box small{
    color:#80604b;
}

.info-box strong{
    display:block;
    margin-top:5px;
    font-size:17px;
}

/* HEADINGS */

h2{
    color:#68140e;
    margin-bottom:15px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
}

label{
    font-size:14px;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #c9a34d;
    border-radius:8px;
    outline:none;
    font-size:15px;
    background:#fffdf7;
}

select:focus,
input:focus{
    border-color:#68140e;
}

/* BUTTONS */

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn{
    background:#68140e;
    color:white;
}

.add-btn:hover{
    background:#8b2118;
}

.remove-btn{
    background:#b3261e;
    color:white;
    padding:7px 12px;
}

.remove-btn:hover{
    background:#8d1712;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    min-width:650px;
}

th{
    background:#68140e;
    color:#ffd95a;
    padding:12px;
}

td{
    padding:11px;
    border-bottom:1px solid #ead9aa;
    text-align:center;
}

.empty{
    text-align:center;
    padding:25px;
    color:#8a7767;
}

/* SUMMARY */

.summary{
    display:flex;
    justify-content:flex-end;
}

.summary-box{
    width:350px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #ead9aa;
}

.total-row input{
    width:120px;
    text-align:right;
}

.grand-total{
    font-size:23px;
    font-weight:bold;
    color:#68140e;
    border-bottom:none;
}

/* PAYMENT */

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.payment label{
    border:2px solid #e1c36c;
    padding:14px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    background:#fffaf0;
}

.payment label:hover{
    border-color:#68140e;
}

.payment input{
    width:auto;
    margin-right:7px;
}

/* SAVE */

.save-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    font-size:18px;
    background:linear-gradient(135deg,#8b5a00,#d5a52b);
    color:white;
}

.save-btn:hover{
    opacity:.9;
}

/* MESSAGE */

.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e4f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

/* LOADING */

.loading{
    text-align:center;
    padding:20px;
    color:#68140e;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:700px){

    .header h1{
        font-size:21px;
    }

    .bill-info{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary{
        justify-content:stretch;
    }

    .summary-box{
        width:100%;
    }

    .payment{
        grid-template-columns:1fr;
    }

    .card{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="header">

    <img
        src="logo.jpg"
        class="logo"
        alt="Raghavendra Sweets Logo"
    >

    <h1>RAGHAVENDRA SWEETS</h1>

    <p>Billing System</p>

</header>


<main class="container">

    <!-- BILL INFORMATION -->

    <div class="card">

        <div class="bill-info">

            <div class="info-box">

                <small>Bill Number</small>

                <strong id="billNumber">
                    Generating...
                </strong>

            </div>


            <div class="info-box">

                <small>Date</small>

                <strong id="billDate">
                    --
                </strong>

            </div>


            <div class="info-box">

                <small>Time</small>

                <strong id="billTime">
                    --
                </strong>

            </div>

        </div>

    </div>


    <!-- ADD SWEET -->

    <div class="card">

        <h2>🍬 Add Sweet</h2>

        <div class="form-grid">

            <div>

                <label>Select Sweet</label>

                <select id="productSelect">

                    <option value="">
                        Loading sweets...
                    </option>

                </select>

            </div>


            <div>

                <label>Quantity (KG)</label>

                <input
                    type="number"
                    id="quantity"
                    min="0.001"
                    step="0.001"
                    placeholder="0.250"
                >

            </div>


            <div>

                <label>Price / KG</label>

                <input
                    type="text"
                    id="price"
                    readonly
                    placeholder="₹0.00"
                >

            </div>


            <button
                class="add-btn"
                onclick="addItem()"
            >
                + Add
            </button>

        </div>

    </div>


    <!-- CURRENT BILL -->

    <div class="card">

        <h2>🧾 Current Bill</h2>

        <div id="billTable">

            <div class="empty">
                No sweets added yet.
            </div>

        </div>

    </div>


    <!-- PAYMENT -->

    <div class="card">

        <h2>💰 Payment</h2>

        <div class="summary">

            <div class="summary-box">

                <div class="total-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        ₹0.00
                    </strong>

                </div>


                <div class="total-row">

                    <span>
                        Discount
                    </span>

                    <input
                        type="number"
                        id="discount"
                        min="0"
                        value="0"
                        oninput="calculateTotal()"
                    >

                </div>


                <div class="total-row grand-total">

                    <span>
                        TOTAL
                    </span>

                    <strong id="grandTotal">
                        ₹0.00
                    </strong>

                </div>

            </div>

        </div>


        <!-- PAYMENT METHOD -->

        <div class="payment">

            <label>

                <input
                    type="radio"
                    name="payment"
                    value="Cash"
                    checked
                >

                💵 Cash

            </label>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="Card"
                >

                💳 Card

            </label>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="UPI"
                >

                📱 UPI

            </label>

        </div>


        <button
            class="save-btn"
            onclick="saveBill()"
            id="saveButton"
        >
            🧾 SAVE BILL
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</main>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   VARIABLES
   ===================================================== */

let products = [];

let cart = [];


/* =====================================================
   START
   ===================================================== */

window.addEventListener("load", function(){

    updateDateTime();

    generateBillNumber();

    loadProducts();

});


/* =====================================================
   DATE & TIME
   ===================================================== */

function updateDateTime(){

    const now = new Date();

    document.getElementById("billDate").textContent =
        now.toLocaleDateString("en-IN");

    document.getElementById("billTime").textContent =
        now.toLocaleTimeString("en-IN");

}


/* =====================================================
   BILL NUMBER
   ===================================================== */

function generateBillNumber(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    const bill =
        `RS-${year}${month}${day}-${random}`;

    document.getElementById(
        "billNumber"
    ).textContent = bill;

}


/* =====================================================
   LOAD PRODUCTS
   IMPORTANT:
   NO active column used
   ===================================================== */

async function loadProducts(){

    const select =
        document.getElementById(
            "productSelect"
        );

    select.innerHTML =
        `<option value="">
            Loading sweets...
        </option>`;


    try{

        const url =
            `${SUPABASE_URL}/rest/v1/products` +
            `?select=id,name,price_per_kg,stock_kg` +
            `&order=name.asc`;


        console.log(
            "Loading products:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const responseText =
            await response.text();


        console.log(
            "Supabase response:",
            response.status,
            responseText
        );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}: ${responseText}`
            );

        }


        products =
            JSON.parse(responseText);


        if(!Array.isArray(products)){

            throw new Error(
                "Products response is not an array"
            );

        }


        console.log(
            "Products loaded:",
            products.length
        );


        select.innerHTML =
            `<option value="">
                Select Sweet
            </option>`;


        products.forEach(function(product){

            const option =
                document.createElement("option");


            option.value =
                product.id;


            option.textContent =
                `${product.name} — ₹${Number(
                    product.price_per_kg
                ).toFixed(2)}/KG — Stock: ${Number(
                    product.stock_kg
                ).toFixed(3)} KG`;


            select.appendChild(option);

        });


        if(products.length === 0){

            select.innerHTML =
                `<option value="">
                    No sweets found
                </option>`;

        }


        showMessage(
            `✅ ${products.length} sweets loaded successfully.`,
            true
        );


    }
    catch(error){

        console.error(
            "PRODUCT LOAD ERROR:",
            error
        );


        select.innerHTML =
            `<option value="">
                Products loading failed
            </option>`;


        showMessage(
            `❌ Products load avvaledu.<br><br>${escapeHtml(error.message)}`,
            false
        );

    }

}


/* =====================================================
   PRODUCT CHANGE
   ===================================================== */

document
.getElementById("productSelect")
.addEventListener(
    "change",
    function(){

        const productId =
            Number(this.value);


        const product =
            products.find(
                function(p){
                    return Number(p.id)
                    === productId;
                }
            );


        if(product){

            document.getElementById(
                "price"
            ).value =
                `₹${Number(
                    product.price_per_kg
                ).toFixed(2)}`;

        }
        else{

            document.getElementById(
                "price"
            ).value = "";

        }

    }
);


/* =====================================================
   ADD ITEM
   ===================================================== */

function addItem(){

    const productId =
        Number(
            document.getElementById(
                "productSelect"
            ).value
        );


    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value
        );


    if(!productId){

        alert(
            "Sweet select cheyyi."
        );

        return;

    }


    if(!quantity || quantity <= 0){

        alert(
            "Valid quantity enter cheyyi."
        );

        return;

    }


    const product =
        products.find(
            function(p){
                return Number(p.id)
                === productId;
            }
        );


    if(!product){

        alert(
            "Product dorakaledu."
        );

        return;

    }


    const stock =
        Number(product.stock_kg);


    if(quantity > stock){

        alert(
            `Stock available: ${stock.toFixed(3)} KG`
        );

        return;

    }


    const existing =
        cart.find(
            function(item){
                return Number(
                    item.product_id
                ) === productId;
            }
        );


    if(existing){

        const newQuantity =
            existing.quantity_kg +
            quantity;


        if(newQuantity > stock){

            alert(
                `Stock available: ${stock.toFixed(3)} KG`
            );

            return;

        }


        existing.quantity_kg =
            newQuantity;


        existing.item_total =
            newQuantity *
            Number(product.price_per_kg);

    }
    else{

        cart.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity_kg:
                quantity,

            price_per_kg:
                Number(
                    product.price_per_kg
                ),

            item_total:
                quantity *
                Number(
                    product.price_per_kg
                )

        });

    }


    document.getElementById(
        "quantity"
    ).value = "";


    renderBill();

}


/* =====================================================
   RENDER BILL
   ===================================================== */

function renderBill(){

    const container =
        document.getElementById(
            "billTable"
        );


    if(cart.length === 0){

        container.innerHTML =
            `<div class="empty">
                No sweets added yet.
             </div>`;


        calculateTotal();

        return;

    }


    let html = `

        <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>S.No</th>

                    <th>Sweet</th>

                    <th>Qty KG</th>

                    <th>Price/KG</th>

                    <th>Total</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

    `;


    cart.forEach(
        function(item,index){

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.product_name
                        )}
                    </td>

                    <td>
                        ${item.quantity_kg.toFixed(3)}
                    </td>

                    <td>
                        ₹${item.price_per_kg.toFixed(2)}
                    </td>

                    <td>
                        ₹${item.item_total.toFixed(2)}
                    </td>

                    <td>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;


    calculateTotal();

}


/* =====================================================
   REMOVE ITEM
   ===================================================== */

function removeItem(index){

    cart.splice(index,1);

    renderBill();

}


/* =====================================================
   CALCULATE TOTAL
   ===================================================== */

function calculateTotal(){

    const subtotal =
        cart.reduce(
            function(sum,item){

                return sum +
                    item.item_total;

            },
            0
        );


    let discount =
        Number(
            document.getElementById(
                "discount"
            ).value
        ) || 0;


    if(discount < 0){

        discount = 0;

        document.getElementById(
            "discount"
        ).value = 0;

    }


    if(discount > subtotal){

        discount = subtotal;

        document.getElementById(
            "discount"
        ).value =
            discount;

    }


    const total =
        subtotal -
        discount;


    document.getElementById(
        "subtotal"
    ).textContent =
        `₹${subtotal.toFixed(2)}`
