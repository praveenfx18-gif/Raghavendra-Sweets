<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f6e2aa);
    color:#4b160f;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#68140e,#8f2118);
    color:#fff;
    padding:18px;
    text-align:center;
    border-bottom:4px solid #d5a52b;
}

header h1{
    font-size:30px;
    color:#ffd966;
}

header p{
    margin-top:5px;
    color:#fff4cc;
}

/* MAIN */
.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

/* PRODUCTS */
.products-section{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.section-title{
    font-size:23px;
    margin-bottom:15px;
    color:#68140e;
    border-bottom:2px solid #d5a52b;
    padding-bottom:8px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:15px;
}

.product{
    border:2px solid #ead39a;
    border-radius:12px;
    padding:15px;
    background:#fffdf7;
    text-align:center;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.product h3{
    color:#68140e;
    margin-bottom:8px;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#9a6510;
    margin-bottom:12px;
}

.quantity-select{
    width:100%;
    padding:9px;
    border:1px solid #c9a84c;
    border-radius:7px;
    margin-bottom:10px;
    background:white;
}

.add-btn{
    width:100%;
    border:none;
    padding:10px;
    border-radius:8px;
    background:#68140e;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:hover{
    background:#8f2118;
}

/* BILL */
.bill-section{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    height:max-content;
    position:sticky;
    top:15px;
}

.bill-header{
    text-align:center;
    border-bottom:2px dashed #999;
    padding-bottom:12px;
    margin-bottom:12px;
}

.bill-header h2{
    color:#68140e;
}

.bill-info{
    font-size:13px;
    color:#555;
    margin-top:5px;
}

.bill-items{
    max-height:350px;
    overflow-y:auto;
}

.bill-item{
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.item-top{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.item-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    font-size:13px;
    color:#555;
}

.remove-btn{
    background:#c62828;
    color:white;
    border:none;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* TOTAL */
.total-box{
    border-top:2px solid #68140e;
    margin-top:15px;
    padding-top:12px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
}

.grand-total{
    font-size:25px;
    font-weight:bold;
    color:#68140e;
    margin-top:10px;
}

/* PAYMENT */
.payment{
    margin-top:15px;
}

.payment h3{
    margin-bottom:8px;
}

.payment-options{
    display:flex;
    gap:8px;
}

.payment-option{
    flex:1;
    padding:10px;
    border:2px solid #d5a52b;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
}

.payment-option.active{
    background:#68140e;
    color:white;
}

/* BUTTONS */
.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.main-btn{
    border:none;
    padding:13px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.print-btn{
    background:#2e7d32;
    color:white;
}

.clear-btn{
    background:#c62828;
    color:white;
}

.print-btn:hover{
    background:#1b5e20;
}

.clear-btn:hover{
    background:#8e0000;
}

/* MOBILE */
@media(max-width:800px){
    .container{
        grid-template-columns:1fr;
    }

    .bill-section{
        position:static;
    }
}

/* PRINT */
@media print{

    body{
        background:white;
    }

    body *{
        visibility:hidden;
    }

    .bill-section,
    .bill-section *{
        visibility:visible;
    }

    .bill-section{
        position:absolute;
        left:0;
        top:0;
        width:80mm;
        max-width:80mm;
        box-shadow:none;
        padding:5mm;
        margin:0;
    }

    .buttons,
    .payment{
        display:none;
    }

    .bill-items{
        max-height:none;
        overflow:visible;
    }

    .remove-btn{
        display:none;
    }

    .bill-section{
        border:none;
    }

    .bill-header h2{
        font-size:20px;
    }

    .grand-total{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍬 RAGHAVENDRA SWEETS 🍬</h1>
    <p>Billing Counter</p>
</header>

<div class="container">

    <!-- PRODUCTS -->
    <section class="products-section">

        <div class="section-title">
            🍬 Sweets
        </div>

        <div class="products" id="products"></div>

    </section>


    <!-- BILL -->
    <section class="bill-section">

        <div class="bill-header">
            <h2>RAGHAVENDRA SWEETS</h2>
            <div class="bill-info">
                Bill No: <span id="billNumber"></span>
            </div>
            <div class="bill-info">
                <span id="dateTime"></span>
            </div>
        </div>

        <div id="billItems" class="bill-items">

            <div class="empty">
                No items added
            </div>

        </div>

        <div class="total-box">

            <div class="total-row">
                <span>Subtotal</span>
                <strong>₹<span id="subtotal">0.00</span></strong>
            </div>

            <div class="total-row">
                <span>Discount</span>
                <strong>₹0.00</strong>
            </div>

            <div class="total-row grand-total">
                <span>TOTAL</span>
                <span>₹<span id="total">0.00</span></span>
            </div>

        </div>


        <!-- PAYMENT -->
        <div class="payment">

            <h3>Payment Method</h3>

            <div class="payment-options">

                <div
                    class="payment-option active"
                    id="cash"
                    onclick="selectPayment('CASH')">
                    💵 Cash
                </div>

                <div
                    class="payment-option"
                    id="card"
                    onclick="selectPayment('CARD')">
                    💳 Card
                </div>

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <button
                class="main-btn clear-btn"
                onclick="clearBill()">
                🗑 Clear
            </button>

            <button
                class="main-btn print-btn"
                onclick="printBill()">
                🖨 Print Bill
            </button>

        </div>

    </section>

</div>


<script>

/* =====================================
   PRODUCTS
===================================== */

const products = [

    {
        id:1,
        name:"Kaju Katli",
        price:700
    },

    {
        id:2,
        name:"Gulab Jamun",
        price:280
    },

    {
        id:3,
        name:"Mysore Pak",
        price:480
    },

    {
        id:4,
        name:"Boondi Laddu",
        price:360
    },

    {
        id:5,
        name:"Motichoor Laddu",
        price:420
    },

    {
        id:6,
        name:"Rasmalai",
        price:500
    },

    {
        id:7,
        name:"Badusha",
        price:360
    },

    {
        id:8,
        name:"Jangri",
        price:400
    },

    {
        id:9,
        name:"Doodh Peda",
        price:460
    },

    {
        id:10,
        name:"Milk Mysore Pak",
        price:520
    },

    {
        id:11,
        name:"Dry Fruit Laddu",
        price:650
    },

    {
        id:12,
        name:"Soan Papdi",
        price:320
    }

];


/* =====================================
   BILL DATA
===================================== */

let cart = [];

let paymentMethod = "CASH";


/* =====================================
   BILL NUMBER
===================================== */

let billNumber =
    "RS-" +
    new Date().getFullYear() +
    "-" +
    Math.floor(1000 + Math.random() * 9000);

document.getElementById("billNumber").textContent =
    billNumber;


/* =====================================
   DATE & TIME
===================================== */

function updateDateTime(){

    const now = new Date();

    document.getElementById("dateTime").textContent =
        now.toLocaleDateString("en-IN") +
        " " +
        now.toLocaleTimeString("en-IN");

}

updateDateTime();

setInterval(updateDateTime,1000);


/* =====================================
   SHOW PRODUCTS
===================================== */

function displayProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <h3>${product.name}</h3>

            <div class="price">
                ₹${product.price}/KG
            </div>

            <select
                class="quantity-select"
                id="qty-${product.id}">

                <option value="0.25">
                    250 g
                </option>

                <option value="0.5">
                    500 g
                </option>

                <option value="0.75">
                    750 g
                </option>

                <option value="1" selected>
                    1 KG
                </option>

                <option value="1.25">
                    1.25 KG
                </option>

                <option value="1.5">
                    1.5 KG
                </option>

                <option value="2">
                    2 KG
                </option>

            </select>

            <button
                class="add-btn"
                onclick="addToBill(${product.id})">

                + Add to Bill

            </button>

        `;

        container.appendChild(div);

    });

}


/* =====================================
   ADD TO BILL
===================================== */

function addToBill(productId){

    const product =
        products.find(p => p.id === productId);

    const quantity =
        parseFloat(
            document.getElementById(
                "qty-" + productId
            ).value
        );

    const existing =
        cart.find(item =>
            item.id === productId &&
            item.quantity === quantity
        );

    if(existing){

        existing.count++;

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            quantity:quantity,

            count:1

        });

    }

    renderBill();

}


/* =====================================
   RENDER BILL
===================================== */

function renderBill(){

    const billItems =
        document.getElementById("billItems");

    billItems.innerHTML = "";

    if(cart.length === 0){

        billItems.innerHTML = `
            <div class="empty">
                No items added
            </div>
        `;

        document.getElementById("subtotal")
            .textContent = "0.00";

        document.getElementById("total")
            .textContent = "0.00";

        return;
    }


    let subtotal = 0;


    cart.forEach((item,index) => {

        const itemTotal =
            item.price *
            item.quantity *
            item.count;

        subtotal += itemTotal;


        let quantityText;

        if(item.quantity < 1){

            quantityText =
                Math.round(item.quantity * 1000) +
                " g";

        }else{

            quantityText =
                item.quantity + " KG";

        }


        const div =
            document.createElement("div");

        div.className = "bill-item";

        div.innerHTML = `

            <div class="item-top">

                <span>
                    ${item.name}
                </span>

                <span>
                    ₹${itemTotal.toFixed(2)}
                </span>

            </div>

            <div class="item-bottom">

                <span>
                    ${quantityText}
                    ${item.count > 1
                        ? " × " + item.count
                        : ""}
                </span>

                <span>
                    ₹${item.price}/KG
                </span>

                <button
                    class="remove-btn"
                    onclick="removeItem(${index})">

                    Remove

                </button>

            </div>

        `;

        billItems.appendChild(div);

    });


    document.getElementById("subtotal")
        .textContent =
        subtotal.toFixed(2);

    document.getElementById("total")
        .textContent =
        subtotal.toFixed(2);

}


/* =====================================
   REMOVE ITEM
===================================== */

function removeItem(index){

    cart.splice(index,1);

    renderBill();

}


/* =====================================
   PAYMENT
===================================== */

function selectPayment(method){

    paymentMethod = method;

    document
        .getElementById("cash")
        .classList.remove("active");

    document
        .getElementById("card")
        .classList.remove("active");


    if(method === "CASH"){

        document
            .getElementById("cash")
            .classList.add("active");

    }else{

        document
            .getElementById("card")
            .classList.add("active");

    }

}


/* =====================================
   PRINT
===================================== */

function printBill(){

    if(cart.length === 0){

        alert(
            "Please add at least one item to the bill."
        );

        return;

    }


    window.print();

}


/* =====================================
   CLEAR BILL
===================================== */

function clearBill(){

    if(cart.length === 0){
        return;
    }


    const confirmClear =
        confirm(
            "Clear the current bill?"
        );


    if(!confirmClear){
        return;
    }


    cart = [];

    paymentMethod = "CASH";

    billNumber =
        "RS-" +
        new Date().getFullYear() +
        "-" +
        Math.floor(1000 + Math.random() * 9000);


    document.getElementById("billNumber")
        .textContent =
        billNumber;


    selectPayment("CASH");

    renderBill();

}


/* =====================================
   START
===================================== */

displayProducts();

renderBill();

</script>

</body>
</html>
