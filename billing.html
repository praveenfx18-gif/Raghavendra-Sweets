<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f0d58c);
    color:#35120d;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#68140e,#350604);
    color:white;
    text-align:center;
    padding:20px 15px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.logo{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d5a52b;
    background:white;
    padding:3px;
}

.header h1{
    margin-top:8px;
    color:#ffd95a;
    font-size:26px;
}

.header p{
    margin-top:5px;
    color:#fff0b5;
}

.container{
    width:94%;
    max-width:1150px;
    margin:22px auto;
}

.status{
    padding:14px;
    border-radius:12px;
    background:#fff8df;
    border:1px solid #dfc16a;
    color:#68140e;
    text-align:center;
    font-weight:bold;
    margin-bottom:18px;
}

.card{
    background:rgba(255,255,255,.97);
    border:1px solid #dfc16a;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 6px 22px rgba(70,30,10,.14);
}

h2{
    color:#68140e;
    margin-bottom:16px;
}

.bill-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.info-box{
    background:#fff9e8;
    border:1px solid #e5c66e;
    border-radius:11px;
    padding:14px;
}

.info-box small{
    color:#80604b;
}

.info-box strong{
    display:block;
    margin-top:5px;
    color:#68140e;
    font-size:17px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #c9a34d;
    border-radius:9px;
    background:#fffdf7;
    color:#35120d;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#68140e;
}

button{
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn{
    background:#68140e;
    color:white;
    padding:13px 20px;
}

.add-btn:hover{
    background:#8b2118;
}

.quick-title{
    margin-top:15px;
    margin-bottom:8px;
    font-size:13px;
    color:#80604b;
    font-weight:bold;
}

.quick-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.quick-buttons button{
    background:#fff4cf;
    color:#68140e;
    border:1px solid #d5a52b;
    padding:8px 14px;
}

.quick-buttons button:hover{
    background:#f4df9c;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#68140e;
    color:#ffd95a;
    padding:12px 8px;
}

td{
    padding:11px 7px;
    border-bottom:1px solid #ead9aa;
    text-align:center;
}

.remove-btn{
    background:#b3261e;
    color:white;
    padding:7px 11px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#8a7767;
}

.summary{
    display:flex;
    justify-content:flex-end;
}

.summary-box{
    width:380px;
    max-width:100%;
}

.total-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #ead9aa;
}

.total-row input{
    width:130px;
    text-align:right;
}

.grand-total{
    border-bottom:0;
    padding-top:16px;
    font-size:24px;
    color:#68140e;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:18px;
}

.payment label{
    border:2px solid #e1c36c;
    border-radius:11px;
    padding:14px;
    text-align:center;
    background:#fffaf0;
    cursor:pointer;
}

.payment input{
    width:auto;
    margin-right:6px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    font-size:18px;
    background:linear-gradient(135deg,#68140e,#a86d00);
    color:white;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px;
    border-radius:9px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e4f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

@media(max-width:750px){

    .bill-info{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .payment{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:22px;
    }

    .card{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="header">

    <img
        src="logo.jpg"
        class="logo"
        alt="Raghavendra Sweets Logo">

    <h1>RAGHAVENDRA SWEETS</h1>

    <p>Smart Billing System</p>

</header>

<main class="container">

<div id="status" class="status">
    Connecting to database...
</div>


<!-- BILL INFORMATION -->

<div class="card">

    <div class="bill-info">

        <div class="info-box">
            <small>Bill Number</small>
            <strong id="billNumber">---</strong>
        </div>

        <div class="info-box">
            <small>Date</small>
            <strong id="billDate">---</strong>
        </div>

        <div class="info-box">
            <small>Time</small>
            <strong id="billTime">---</strong>
        </div>

    </div>

</div>


<!-- ADD SWEET -->

<div class="card">

    <h2>🍬 Add Sweet</h2>

    <div class="form-grid">

        <div>

            <label>Select Sweet</label>

            <select id="productSelect">

                <option value="">
                    Loading sweets...
                </option>

            </select>

        </div>

        <div>

            <label>Quantity (KG)</label>

            <input
                type="number"
                id="quantity"
                min="0.001"
                step="0.001"
                value="0.250">

        </div>

        <div>

            <label>Price / KG</label>

            <input
                type="text"
                id="price"
                readonly
                placeholder="₹0.00">

        </div>

        <button
            type="button"
            class="add-btn"
            onclick="addItem()">

            + Add

        </button>

    </div>


    <div class="quick-title">
        Quick Quantity
    </div>

    <div class="quick-buttons">

        <button type="button"
                onclick="setQuantity(0.250)">
            250g
        </button>

        <button type="button"
                onclick="setQuantity(0.500)">
            500g
        </button>

        <button type="button"
                onclick="setQuantity(0.750)">
            750g
        </button>

        <button type="button"
                onclick="setQuantity(1)">
            1 KG
        </button>

        <button type="button"
                onclick="setQuantity(2)">
            2 KG
        </button>

    </div>

</div>


<!-- CURRENT BILL -->

<div class="card">

    <h2>🧾 Current Bill</h2>

    <div id="billTable">

        <div class="empty">
            No sweets added yet.
        </div>

    </div>

</div>


<!-- PAYMENT -->

<div class="card">

    <h2>💰 Payment</h2>

    <div class="summary">

        <div class="summary-box">

            <div class="total-row">

                <span>Subtotal</span>

                <strong id="subtotal">
                    ₹0.00
                </strong>

            </div>

            <div class="total-row">

                <span>Discount</span>

                <input
                    type="number"
                    id="discount"
                    min="0"
                    step="0.01"
                    value="0">

            </div>

            <div class="total-row grand-total">

                <span>TOTAL</span>

                <strong id="grandTotal">
                    ₹0.00
                </strong>

            </div>

        </div>

    </div>


    <div class="payment">

        <label>
            <input
                type="radio"
                name="payment"
                value="Cash"
                checked>
            💵 Cash
        </label>

        <label>
            <input
                type="radio"
                name="payment"
                value="Card">
            💳 Card
        </label>

        <label>
            <input
                type="radio"
                name="payment"
                value="UPI">
            📱 UPI
        </label>

    </div>


    <button
        type="button"
        class="save-btn"
        onclick="saveBill()">

        🧾 SAVE BILL

    </button>


    <div id="message" class="message"></div>

</div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   VARIABLES
===================================================== */

let products = [];
let cart = [];


/* =====================================================
   START
===================================================== */

window.addEventListener("load", function(){

    generateBillNumber();

    updateDateTime();

    loadProducts();

});


setInterval(updateDateTime,1000);


/* =====================================================
   DATE / TIME
===================================================== */

function updateDateTime(){

    const now = new Date();

    document.getElementById("billDate").textContent =
        now.toLocaleDateString("en-IN");

    document.getElementById("billTime").textContent =
        now.toLocaleTimeString("en-IN");

}


/* =====================================================
   BILL NUMBER
===================================================== */

function generateBillNumber(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    document.getElementById("billNumber")
        .textContent =
        "RS-" +
        year +
        month +
        day +
        "-" +
        random;
}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const status =
        document.getElementById("status");

    const select =
        document.getElementById("productSelect");

    status.textContent =
        "⏳ Loading sweets...";

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/products" +
            "?select=id,name,price_per_kg,stock_kg" +
            "&order=name.asc";

        console.log(
            "SUPABASE URL:",
            url
        );

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    }
                }
            );

        const text =
            await response.text();

        console.log(
            "SUPABASE RESPONSE:",
            text
        );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                text
            );

        }

        products =
            JSON.parse(text);

        if(!Array.isArray(products)){

            throw new Error(
                "Products data invalid"
            );

        }


        /* SORT ALPHABETICALLY */

        products.sort(function(a,b){

            return String(a.name)
                .localeCompare(
                    String(b.name)
                );

        });


        select.innerHTML =
            `<option value="">
                Select Sweet
             </option>`;


        products.forEach(function(product){

            const option =
                document.createElement("option");

            option.value =
                product.id;

            option.textContent =
                product.name +
                " — ₹" +
                money(product.price_per_kg) +
                "/KG — Stock: " +
                kg(product.stock_kg) +
                " KG";

            select.appendChild(option);

        });


        status.textContent =
            "✅ " +
            products.length +
            " sweets loaded successfully";


        showMessage(
            "Sweets loaded successfully.",
            true
        );


        setTimeout(function(){

            document.getElementById(
                "message"
            ).style.display = "none";

        },2500);


    }
    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );

        select.innerHTML =
            `<option value="">
                Failed to load sweets
             </option>`;

        status.textContent =
            "❌ Database connection failed";

        showMessage(
            "❌ " +
            error.message,
            false
        );

    }

}


/* =====================================================
   SELECT PRODUCT
===================================================== */

document.getElementById(
    "productSelect"
).addEventListener(
    "change",
    function(){

        const product =
            products.find(function(item){

                return String(item.id) ===
                       String(
                           this.value
                       );

            },this);


        if(product){

            document.getElementById(
                "price"
            ).value =
                "₹" +
                money(
                    product.price_per_kg
                );

        }
        else{

            document.getElementById(
                "price"
            ).value = "";

        }

    }
);


/* =====================================================
   QUICK QUANTITY
===================================================== */

function setQuantity(value){

    document.getElementById(
        "quantity"
    ).value =
        Number(value).toFixed(3);

}


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(){

    const productId =
        document.getElementById(
            "productSelect"
        ).value;

    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value
        );


    if(!productId){

        alert(
            "First sweet select cheyyi."
        );

        return;

    }


    if(!quantity || quantity <= 0){

        alert(
            "Valid quantity enter cheyyi."
        );

        return;

    }


    const product =
        products.find(function(item){

            return String(item.id) ===
                   String(productId);

        });


    if(!product){

        alert(
            "Product dorakaledu."
        );

        return;

    }


    const stock =
        Number(product.stock_kg) || 0;


    if(quantity > stock){

        alert(
            "Available stock: " +
            kg(stock) +
            " KG"
        );

        return;

    }


    const existing =
        cart.find(function(item){

            return String(
                item.product_id
            ) ===
            String(product.id);

        });


    if(existing){

        const newQuantity =
            existing.quantity_kg +
            quantity;


        if(newQuantity > stock){

            alert(
                "Available stock: " +
                kg(stock) +
                " KG"
            );

            return;

        }


        existing.quantity_kg =
            newQuantity;

        existing.item_total =
            newQuantity *
            existing.price_per_kg;

    }
    else{

        cart.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity_kg:
                quantity,

            price_per_kg:
                Number(
                    product.price_per_kg
                ) || 0,

            item_total:
                quantity *
                (
                    Number(
                        product.price_per_kg
                    ) || 0
                )

        });

    }


    renderBill();

}


/* =====================================================
   RENDER BILL
===================================================== */

function renderBill(){

    const container =
        document.getElementById(
            "billTable"
        );


    if(cart.length === 0){

        container.innerHTML =
            `<div class="empty">
                No sweets added yet.
             </div>`;

        calculateTotal();

        return;

    }


    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>
            <th>S.No</th>
            <th>Sweet</th>
            <th>Qty</th>
            <th>Price/KG</th>
            <th>Total</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>
    `;


    cart.forEach(function(item,index){

        html += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(
                        item.product_name
                    )}
                </td>

                <td>
                    ${kg(
                        item.quantity_kg
                    )} KG
                </td>

                <td>
                    ₹${money(
                        item.price_per_kg
                    )}
                </td>

                <td>
                    ₹${money(
                        item.item_total
                    )}
                </td>

                <td>

                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        Remove

                    </button>

                </td>

            </tr>

        `;

    });


    html += `

        </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;


    calculateTotal();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index){

    cart.splice(
        index,
        1
    );

    renderBill();

}


/* =====================================================
   TOTAL
===================================================== */

document.getElementById(
    "discount"
).addEventListener(
    "input",
    calculateTotal
);


function calculateTotal(){

    let subtotal =
        cart.reduce(
            function(sum,item){

                return sum +
                    Number(
                        item.item_total
                    );

            },
            0
        );


    let discount =
        Number(
            document.getElementById(
