<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f1dda5);
    color:#3d160f;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#68140e,#350805);
    color:white;
    text-align:center;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.logo{
    width:82px;
    height:82px;
    object-fit:cover;
    border-radius:50%;
    background:white;
    padding:3px;
    border:3px solid #d5a52b;
}

.header h1{
    margin-top:8px;
    color:#ffd95a;
    font-size:25px;
}

.header p{
    margin-top:5px;
    color:#fff0b5;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.info{
    background:white;
    border:1px solid #e2c16c;
    border-radius:12px;
    padding:14px;
    box-shadow:0 4px 15px rgba(70,30,10,.10);
}

.info small{
    color:#80604b;
}

.info strong{
    display:block;
    margin-top:5px;
    color:#68140e;
    font-size:17px;
}

.layout{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    border:1px solid #e2c16c;
    box-shadow:0 5px 20px rgba(70,30,10,.12);
}

h2{
    color:#68140e;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #c9a34d;
    border-radius:9px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.product{
    background:#fffdf7;
    border:1px solid #e5cf91;
    border-radius:12px;
    overflow:hidden;
}

.product-img{
    width:100%;
    height:115px;
    object-fit:cover;
    display:block;
}

.no-image{
    width:100%;
    height:115px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    background:linear-gradient(135deg,#fff1c4,#e8cd83);
}

.product-body{
    padding:10px;
}

.product-name{
    color:#68140e;
    font-weight:bold;
    min-height:36px;
}

.price{
    margin-top:4px;
    font-weight:bold;
}

.stock{
    margin-top:4px;
    font-size:12px;
    color:#777;
}

.add-btn{
    width:100%;
    margin-top:9px;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#68140e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:hover{
    background:#8b2118;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:35px 10px;
    color:#80604b;
}

.error-box{
    grid-column:1/-1;
    padding:20px;
    border-radius:10px;
    background:#ffe5e2;
    color:#8b1a13;
    text-align:center;
}

.bill-card{
    position:sticky;
    top:10px;
}

.bill-items{
    max-height:420px;
    overflow-y:auto;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#8a7767;
}

.bill-item{
    border-bottom:1px solid #ead9aa;
    padding:12px 0;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    color:#68140e;
    font-weight:bold;
}

.item-total{
    font-weight:bold;
}

.item-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
}

.qty-control{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty-control button{
    width:28px;
    height:28px;
    border:1px solid #d5b65d;
    border-radius:6px;
    background:#fff3ca;
    color:#68140e;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.remove{
    color:#b3261e;
    cursor:pointer;
    font-weight:bold;
}

.summary{
    margin-top:15px;
    padding-top:10px;
    border-top:2px dashed #d5b65d;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
}

.discount{
    width:95px;
    padding:8px;
    border:1px solid #c9a34d;
    border-radius:7px;
    text-align:right;
}

.total{
    border-top:1px solid #ead9aa;
    margin-top:5px;
    padding-top:13px;
    color:#68140e;
    font-size:23px;
    font-weight:bold;
}

.payment-title{
    margin-top:15px;
    font-weight:bold;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:9px;
}

.payment label{
    padding:11px 4px;
    text-align:center;
    border:1px solid #dfc475;
    border-radius:8px;
    background:#fffaf0;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}

.payment input{
    display:none;
}

.payment label:has(input:checked){
    background:#68140e;
    color:white;
}

.save-btn{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#8b5a00,#d5a52b);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e5f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

    .bill-card{
        position:static;
    }

}

@media(max-width:650px){

    .info-grid{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:420px){

    .header h1{
        font-size:20px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .product-img,
    .no-image{
        height:100px;
    }

}
</style>
</head>

<body>

<header class="header">

    <img
        src="logo.jpg"
        class="logo"
        alt="Raghavendra Sweets Logo">

    <h1>RAGHAVENDRA SWEETS</h1>

    <p>Smart Billing System</p>

</header>


<div class="container">


    <!-- BILL INFO -->

    <div class="info-grid">

        <div class="info">

            <strong id="billNo">Generating...</strong>
        </div>

        <div class="info">

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let cart = [];


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        generateBillNumber();

        updateDateTime();

        setInterval(
            updateDateTime,
            1000
        );

        loadProducts();


        document
            .getElementById("search")
            .addEventListener(
                "input",
                renderProducts
            );


        document
            .getElementById("discount")
            .addEventListener(
                "input",
                calculateTotal
            );


        document
            .getElementById("saveBtn")
            .addEventListener(
                "click",
                saveBill
            );

    }
);


/* =====================================================
   BILL NUMBER
===================================================== */

function generateBillNumber(){

    const now = new Date();

    const date =
        now.getFullYear() +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        String(
            now.getDate()
        ).padStart(2,"0");


    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );


    document
        .getElementById("billNo")
        .textContent =
        "RS-" +
        date +
        "-" +
        random;

}


/* =====================================================
   DATE / TIME
===================================================== */

function updateDateTime(){

    const now = new Date();


    document
        .getElementById("billDate")
        .textContent =
        now.toLocaleDateString(
            "en-IN"
        );


    document
        .getElementById("billTime")
        .textContent =
        now.toLocaleTimeString(
            "en-IN"
        );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const box =
        document.getElementById(
            "products"
        );


    box.innerHTML =
    `
        <div class="loading">
            ⏳ Connecting to Supabase...
        </div>
    `;


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/products?select=*";


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const text =
            await response.text();


        console.log(
            "SUPABASE STATUS:",
            response.status
        );


        console.log(
            "SUPABASE DATA:",
            text
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " : " +
                text
            );

        }


        let data;


        try{

            data =
                JSON.parse(text);

        }
        catch(e){

            throw new Error(
                "Supabase returned invalid JSON."
            );

        }


        if(!Array.isArray(data)){

            throw new Error(
                "Products data is not an array."
            );

        }


        products = data;


        /*
          If active column exists:
          show only active products.

          If active column doesn't exist:
          show all products.
        */

        products =
            products.filter(
                function(product){

                    if(
                        product.active ===
                        undefined ||
                        product.active ===
                        null
                    ){

                        return true;

                    }

                    return product.active === true;

                }
            );


        if(products.length === 0){

            box.innerHTML =
            `
                <div class="loading">

                    ⚠️ Supabase connected.

                    <br><br>

                    But products table is empty.

                </div>
            `;

            return;

        }


        renderProducts();

    }
    catch(error){

        console.error(
            "PRODUCT ERROR:",
            error
        );


        box.innerHTML =
        `
            <div class="error-box">

                ❌ Products Load Failed

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>

            </div>
        `;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const box =
        document.getElementById(
            "products"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        products.filter(
            function(product){

                return String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(search);

            }
        );


    if(filtered.length === 0){

        box.innerHTML =
        `
            <div class="loading">

                😔 Sweet not found.

            </div>
        `;

        return;

    }


    box.innerHTML = "";


    filtered.forEach(
        function(product){

            const price =
                Number(
                    product.price_per_kg
                ) || 0;


            const stock =
                Number(
                    product.stock_kg
                ) || 0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            let imageHTML =
                `
                <div class="no-image">
                    🍬
                </div>
                `;


            if(
                product.image_url &&
                String(
                    product.image_url
                ).trim() !== ""
            ){

                imageHTML =
                `
                <img
                    src="${escapeAttribute(
                        product.image_url
                    )}"
                    class="product-img"
                    alt="${escapeAttribute(
                        product.name
                    )}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    ">

                <div
                    class="no-image"
                    style="display:none">
                    🍬
                </div>
                `;

            }


            card.innerHTML =
            `
                ${imageHTML}

                <div class="product-body">

                    <div class="product-name">

                        ${escapeHtml(
                            product.name
                        )}

                    </div>


                    <div class="price">

                        ₹${price.toFixed(2)} / KG

                    </div>


                    <div class="stock">

                        Stock:
                        ${stock.toFixed(3)}
                        KG

                    </div>


                    <button
                        class="add-btn"
                        onclick="
                            addProduct(
                                ${Number(product.id)}
                            )
                        ">

                        + ADD 250g

                    </button>

                </div>
            `;


            box.appendChild(card);

        }
    );

}


/* =====================================================
   ADD 250 GRAMS
===================================================== */

                return Number(

            }
        );

        );

        return;

    }

        );

        const newQty =
            Number(
                (
                    existing.quantity_kg +
                    0.250
                ).toFixed(3)
            );


        if(newQty > stock){

                "Available stock: " +
                stock.toFix
