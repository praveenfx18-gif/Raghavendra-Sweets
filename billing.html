<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raghavendra Sweets - Billing</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fffaf0,#f1dda5);
    color:#3d160f;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#68140e,#350805);
    color:white;
    text-align:center;
    padding:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.logo{
    width:78px;
    height:78px;
    object-fit:cover;
    border-radius:50%;
    background:white;
    padding:3px;
    border:3px solid #d5a52b;
}

.header h1{
    margin-top:7px;
    color:#ffd95a;
    font-size:24px;
}

.header p{
    margin-top:5px;
    color:#fff0b5;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.top-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.info{
    background:white;
    border:1px solid #e2c16c;
    border-radius:12px;
    padding:13px;
    box-shadow:0 4px 15px rgba(70,30,10,.1);
}

.info small{
    display:block;
    color:#80604b;
}

.info strong{
    display:block;
    margin-top:5px;
    color:#68140e;
}

.main{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    border:1px solid #e2c16c;
    box-shadow:0 5px 20px rgba(70,30,10,.12);
}

h2{
    color:#68140e;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #c9a34d;
    border-radius:9px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.product{
    border:1px solid #e5cf91;
    border-radius:12px;
    overflow:hidden;
    background:#fffdf7;
}

.product-image{
    width:100%;
    height:115px;
    object-fit:cover;
    display:block;
}

.no-image{
    width:100%;
    height:115px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    background:linear-gradient(135deg,#fff1c4,#e8cd83);
}

.product-info{
    padding:10px;
}

.product-name{
    font-weight:bold;
    color:#68140e;
    min-height:36px;
}

.price{
    font-weight:bold;
    margin-top:4px;
}

.stock{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.add-btn{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#68140e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.97);
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:35px;
    color:#80604b;
}

.bill{
    position:sticky;
    top:10px;
}

.bill-items{
    max-height:390px;
    overflow-y:auto;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#8a7767;
}

.bill-item{
    border-bottom:1px solid #ead9aa;
    padding:11px 0;
}

.item-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    font-weight:bold;
    color:#68140e;
}

.item-total{
    font-weight:bold;
}

.item-details{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:12px;
}

.quantity-control{
    display:flex;
    align-items:center;
    gap:5px;
}

.quantity-control button{
    width:28px;
    height:28px;
    border:1px solid #d5b65d;
    border-radius:6px;
    background:#fff3ca;
    color:#68140e;
    font-weight:bold;
    cursor:pointer;
}

.remove{
    color:#b3261e;
    font-weight:bold;
    cursor:pointer;
}

.summary{
    margin-top:15px;
    padding-top:10px;
    border-top:2px dashed #d5b65d;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
}

.discount{
    width:90px;
    padding:8px;
    border:1px solid #c9a34d;
    border-radius:7px;
    text-align:right;
}

.grand-total{
    border-top:1px solid #ead9aa;
    margin-top:5px;
    padding-top:12px;
    color:#68140e;
    font-size:23px;
    font-weight:bold;
}

.payment-title{
    margin-top:15px;
    font-weight:bold;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:9px;
}

.payment label{
    text-align:center;
    padding:11px 4px;
    border:1px solid #dfc475;
    border-radius:8px;
    background:#fffaf0;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.payment input{
    display:none;
}

.payment label:has(input:checked){
    background:#68140e;
    color:white;
}

.save-btn{
    width:100%;
    margin-top:13px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#8b5a00,#d5a52b);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

.message{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    font-size:13px;
}

.success{
    display:block;
    background:#e5f7df;
    color:#24611c;
}

.error{
    display:block;
    background:#ffe1df;
    color:#8b1a13;
}

@media(max-width:900px){

    .main{
        grid-template-columns:1fr;
    }

    .bill{
        position:static;
    }

}

@media(max-width:650px){

    .top-info{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:400px){

    .products{
        grid-template-columns:1fr 1fr;
    }

    .header h1{
        font-size:20px;
    }

}
</style>
</head>

/* =====================================================
   BILL NUMBER
===================================================== */

function generateBillNumber(){

    const now = new Date();

    const date =
        now.getFullYear() +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        String(
            now.getDate()
        ).padStart(2,"0");

    const random =
        Math.floor(
            1000 +
            Math.random()*9000
        );

    document
        .getElementById("billNo")
        .textContent =
        "RS-" +
        date +
        "-" +
        random;

}


/* =====================================================
   DATE TIME
===================================================== */

function updateDateTime(){

    const now = new Date();

    document
        .getElementById("billDate")
        .textContent =
        now.toLocaleDateString(
            "en-IN"
        );

    document
        .getElementById("billTime")
        .textContent =
        now.toLocaleTimeString(
            "en-IN"
        );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const box =
        document.getElementById(
            "products"
        );

    box.innerHTML =
        `
        <div class="loading">
            ⏳ Connecting to products...
        </div>
        `;


    try{

        /*
           IMPORTANT:
           select=* is intentionally used here.
           This avoids problems caused by missing
           optional columns.
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?select=*",
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                "Supabase Error: " +
                response.status +
                " - " +
                text
            );

        }


        const data =
            JSON.parse(text);


        if(!Array.isArray(data)){

            throw new Error(
                "Products response invalid."
            );

        }


        products = data;


        /*
           Active filtering is done here,
           but if active column doesn't exist
           we still display the products.
        */

        products =
            products.filter(
                function(product){

                    if(
                        product.active === undefined ||
                        product.active === null
                    ){
                        return true;
                    }

                    return product.active === true;

                }
            );


        renderProducts();


    }
    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        box.innerHTML =
        `
        <div class="loading">

            ❌ Products load failed

            <br><br>

            <small>
                ${escapeHtml(
                    error.message
                )}
            </small>

        </div>
        `;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const box =
        document.getElementById(
            "products"
        );


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        products.filter(
            function(product){

                return String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(search);

            }
        );


    if(filtered.length === 0){

        box.innerHTML =
        `
        <div class="loading">
            😔 Sweet not found
        </div>
        `;

        return;

    }


    box.innerHTML = "";


    filtered.forEach(
        function(product){

            const price =
                Number(
                    product.price_per_kg
                ) || 0;


            const stock =
                Number(
                    product.stock_kg
                ) || 0;


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "product";


            let imageHTML = "";


            if(
                product.image_url &&
                String(
                    product.image_url
                ).trim() !== ""
            ){

                imageHTML =
                `
                <img
                    src="${escapeAttribute(
                        product.image_url
                    )}"
                    class="product-image"
                    alt="${escapeAttribute(
                        product.name
                    )}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    ">

                <div
                    class="no-image"
                    style="display:none">
                    🍬
                </div>
                `;

            }
            else{

                imageHTML =
                `
                <div class="no-image">
                    🍬
                </div>
                `;

            }


            card.innerHTML =
            `
            ${imageHTML}

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(
                        product.name
                    )}
                </div>

                <div class="price">
                    ₹${price.toFixed(2)} / KG
                </div>

                <div class="stock">
                    Stock:
                    ${stock.toFixed(3)} KG
                </div>

                <button
                    class="add-btn"
                    onclick="
                        addProduct(
                            ${Number(product.id)}
                        )
                    ">

                    + ADD 250g

                </button>

            </div>
            `;


            box.appendChild(card);

        }
    );

}


/* =====================================================
   ADD PRODUCT
===================================================== */

function addProduct(id){

    const product =
        products.find(
            function(item){

                return Number(item.id) ===
                    Number(id);

            }
        );


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    const stock =
        Number(
            product.stock_kg
        ) || 0;


    if(stock <= 0){

        alert(
            "Stock unavailable."
        );

        return;

    }


    const existing =
        cart.find(
            function(item){

                return Number(
                    item.product_id
                ) === Number(id);

            }
        );


    if(existing){

        const newQty =
            existing.quantity_kg +
            0.250;


        if(newQty > stock){

            alert(
                "Available stock: " +
                stock.toFixed(3) +
                " KG"
            );

            return;

        }


        existing.quantity_kg =
            Number(
                newQty.toFixed(3)
            );


        existing.item_total =
            existing.quantity_kg *
            existing.price_per_kg;

    }
    else{

        const price =
            Number(
                product.price_per_kg
            ) || 0;


        cart.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity_kg:
                0.250,

            price_per_kg:
                price,

            item_total:
                0.250 * price

        });

    }


    renderBill();

}
