<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Raghavendra Sweets - Login</title>

<link rel="stylesheet" href="style.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><div class="login-container">

    <div class="login-card">

        <img src="logo.png" alt="Raghavendra Sweets Logo" class="logo">

        <h1>Raghavendra Sweets</h1>

        <p class="subtitle">Welcome Back</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

            <p id="message"></p>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
