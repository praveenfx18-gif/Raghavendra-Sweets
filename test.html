<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supabase Test</title>
</head>

<body>

<h2>Supabase Connection Test</h2>

<div id="result">Testing...</div>

<script>

const SUPABASE_URL =
"https://vajhxvghtyiwcdnbbwpt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3Qx2SKaQYx8hXRfaaEvU-A_1AU_eY3A";

async function test(){

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/products?select=id,name,price_per_kg,stock_kg,active&limit=5",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );

        const text = await response.text();

        document.getElementById("result").innerHTML =
            "<pre>" +
            response.status +
            "\n\n" +
            text +
            "</pre>";

    }catch(error){

        document.getElementById("result").innerHTML =
            "<pre>" + error + "</pre>";

    }

}

test();

</script>

</body>
</html>
